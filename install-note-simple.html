<!-- Add this block directly under your APK download button -->
<div style="max-width:480px; margin:8px auto 0; text-align:center; font-family:sans-serif; font-size:12px; color:#888;">
  <p style="margin:0 0 4px;">Downloading directly? Your phone may ask for permission before installing — this is normal.</p>
  <ol style="display:inline-block; text-align:left; margin:0; padding-left:16px;">
    <li>Tap the downloaded APK file</li>
    <li>If prompted, tap "Settings" → enable "Allow from this source"</li>
    <li>Go back and tap Install</li>
  </ol>
</div>
